name: Cleanup Artifact Registry

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      keep_count_dev:
        description: 'Number of images to keep (Dev)'
        required: false
        default: '10'
        type: string
      keep_count_prod:
        description: 'Number of images to keep (Prod)'
        required: false
        default: '20'
        type: string

permissions:
  id-token: write
  contents: read

env:
  REGION: 'australia-southeast1'
  REPO: 'backend-repo'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cleanup-dev:
    name: Cleanup Development Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (Dev)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: invoice-660f3

      - name: Get currently deployed image
        id: current
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/invoice-660f3/${{ env.REPO }}/backend-dev"
          CURRENT_IMAGE=$(gcloud run services describe backend-dev \
            --region ${{ env.REGION }} \
            --project invoice-660f3 \
            --format 'value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")

          if [ -z "$CURRENT_IMAGE" ]; then
            echo "::warning::Could not fetch current image; protection falls back to the keep window"
            echo "digest=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "::notice::Current image: ${CURRENT_IMAGE##*/}"

          if [[ "$CURRENT_IMAGE" == *"@sha256:"* ]]; then
            # Deployed by digest.
            echo "digest=${CURRENT_IMAGE##*@}" >> $GITHUB_OUTPUT
          else
            # Deployed by TAG (this is what the dev deploy does today).
            # `cut -d'@' -f2` returns the whole string when there is no '@',
            # which silently produced a value that never matched any digest
            # and left the deployed image unprotected.
            TAG="${CURRENT_IMAGE##*:}"
            # Exact match on the tag column: -v t=... with $1==t. Grepping
            # "^${TAG}$" against --format=value(VERSION) does not work because
            # that column holds the full projects/... version path, and the
            # --filter= operator is deprecated and unreliable here.
            RESOLVED=$(gcloud artifacts docker tags list "$IMAGE_PATH" \
              --project=invoice-660f3 2>/dev/null \
              | awk -v t="$TAG" '$1==t {print $NF; exit}')
            if [ -n "$RESOLVED" ]; then
              echo "::notice::Resolved tag ${TAG} to ${RESOLVED:0:19}"
              echo "digest=$RESOLVED" >> $GITHUB_OUTPUT
            else
              echo "::warning::Could not resolve tag ${TAG}; keeping via keep window only"
              echo "digest=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: List images before cleanup
        run: |
          echo "Images before cleanup:"
          TOTAL=$(gcloud artifacts docker images list \
            ${{ env.REGION }}-docker.pkg.dev/invoice-660f3/${{ env.REPO }}/backend-dev \
            --project=invoice-660f3 \
            --format="value(VERSION)" 2>/dev/null | grep -c "sha256:" || echo "0")

          echo "Total images: $TOTAL"
          echo "total_before=$TOTAL" >> $GITHUB_ENV

      - name: Cleanup old images (keep last 10)
        run: |
          KEEP_COUNT="${{ github.event.inputs.keep_count_dev || '10' }}"
          CURRENT_DIGEST="${{ steps.current.outputs.digest }}"
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/invoice-660f3/${{ env.REPO }}/backend-dev"

          echo "Keeping last $KEEP_COUNT images"
          [ -n "$CURRENT_DIGEST" ] && echo "Protecting deployed digest: $CURRENT_DIGEST"

          # Filter to sha256: lines so any header/banner text gcloud writes can
          # never be counted as an image and shift the keep window.
          IMAGES=$(gcloud artifacts docker images list \
            "$IMAGE_PATH" \
            --format="value(VERSION)" \
            --sort-by="~UPDATE_TIME" \
            --project=invoice-660f3 2>/dev/null | grep "sha256:" || echo "")

          if [ -z "$IMAGES" ]; then
            echo "::notice::No images found to cleanup"
            exit 0
          fi

          TOTAL=$(echo "$IMAGES" | wc -l | tr -d ' ')
          TO_DELETE=$((TOTAL - KEEP_COUNT))

          if [ "$TO_DELETE" -le 0 ]; then
            echo "::notice::Nothing to delete - only $TOTAL images exist"
            exit 0
          fi

          echo "Deleting $TO_DELETE old images..."
          DELETED=0
          SKIPPED=0
          RETAINED=0

          while read -r version; do
            if [ -z "$version" ]; then continue; fi

            if [ -n "$CURRENT_DIGEST" ] && [ "$version" = "$CURRENT_DIGEST" ]; then
              echo "::notice::Skipping deployed image: ${version:0:12}"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            OUTPUT=$(gcloud artifacts docker images delete "$IMAGE_PATH@$version" \
              --project=invoice-660f3 \
              --delete-tags \
              --quiet 2>&1) && RC=0 || RC=$?

            if [ "$RC" -eq 0 ]; then
              echo "Deleted: ${version:0:12}"
              DELETED=$((DELETED + 1))
            elif echo "$OUTPUT" | grep -q "referenced by parent manifests"; then
              # Multi-arch child manifest. Artifact Registry refuses these while
              # their parent index exists, and they can never be deleted on
              # their own. This is expected, not an error.
              echo "Retained (child manifest of a kept index): ${version:0:12}"
              RETAINED=$((RETAINED + 1))
            else
              echo "::warning::Failed to delete ${version:0:12}: $(echo "$OUTPUT" | grep -iE 'ERROR' | head -1)"
            fi
          done < <(echo "$IMAGES" | tail -n "+$((KEEP_COUNT + 1))")

          echo "::notice::Deleted $DELETED, skipped $SKIPPED, retained $RETAINED child manifests"

      - name: List images after cleanup
        if: always()
        run: |
          echo "Images after cleanup:"
          TOTAL=$(gcloud artifacts docker images list \
            ${{ env.REGION }}-docker.pkg.dev/invoice-660f3/${{ env.REPO }}/backend-dev \
            --project=invoice-660f3 \
            --format="value(VERSION)" 2>/dev/null | grep -c "sha256:" || echo "0")

          echo "Total images: $TOTAL"
          echo "total_after=$TOTAL" >> $GITHUB_ENV

      - name: Create cleanup summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🧹 Development Cleanup Summary
          
          **Environment:** Development
          **Project:** invoice-660f3
          **Service:** backend-dev
          **Region:** ${{ env.REGION }}
          
          ### Results
          - Images before: ${total_before:-N/A}
          - Images after: ${total_after:-N/A}
          - Images deleted: $((${total_before:-0} - ${total_after:-0}))
          
          ### Configuration
          - Keep count: ${{ github.event.inputs.keep_count_dev || '10' }}
          - Deployed image protected: ✅ (resolved from tag when deployed by tag)
          - Multi-arch child manifests retained: expected, they belong to a kept index

          EOF

  cleanup-prod:
    name: Cleanup Production Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The production project is not provisioned yet. Skip rather than fail
      # every Sunday, so the dev result is not buried in unrelated red.
      - name: Check production project exists
        id: prod_exists
        run: |
          if gcloud projects describe carenest-prods --format="value(projectId)" >/dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::notice::Project carenest-prods not provisioned; skipping production cleanup"
          fi

      - name: Checkout code
        if: steps.prod_exists.outputs.found == 'true'
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (Prod)
        if: steps.prod_exists.outputs.found == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.PROD_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.prod_exists.outputs.found == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: carenest-prods

      - name: Get currently deployed image
        id: current
        if: steps.prod_exists.outputs.found == 'true'
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/carenest-prods/${{ env.REPO }}/backend-prod"
          CURRENT_IMAGE=$(gcloud run services describe backend-prod \
            --region ${{ env.REGION }} \
            --project carenest-prods \
            --format 'value(spec.template.spec.containers[0].image)' 2>/dev/null || echo "")

          if [ -z "$CURRENT_IMAGE" ]; then
            echo "::warning::Could not fetch current image"
            echo "digest=" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "$CURRENT_IMAGE" == *"@sha256:"* ]]; then
            echo "digest=${CURRENT_IMAGE##*@}" >> $GITHUB_OUTPUT
          else
            TAG="${CURRENT_IMAGE##*:}"
            RESOLVED=$(gcloud artifacts docker tags list "$IMAGE_PATH" \
              --project=carenest-prods 2>/dev/null \
              | awk -v t="$TAG" '$1==t {print $NF; exit}')
            if [ -n "$RESOLVED" ]; then
              echo "digest=$RESOLVED" >> $GITHUB_OUTPUT
            else
              echo "::warning::Could not resolve deployed tag ${TAG}"
              echo "digest=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Get recent revisions
        id: revisions
        if: steps.prod_exists.outputs.found == 'true'
        run: |
          # On a revision the image lives at spec.containers[0].image. The
          # spec.template.* path returns empty here, so this step used to
          # protect nothing while still reporting success.
          REVISION_IMAGES=$(gcloud run revisions list \
            --service=backend-prod \
            --region=${{ env.REGION }} \
            --project=carenest-prods \
            --limit=5 \
            --format='value(spec.containers[0].image)' 2>/dev/null || echo "")

          PROTECTED_DIGESTS=$(echo "$REVISION_IMAGES" \
            | grep "sha256:" | sed 's|.*@||' | tr '\n' ',' | sed 's/,$//')

          if [ -n "$PROTECTED_DIGESTS" ]; then
            echo "digests=$PROTECTED_DIGESTS" >> $GITHUB_OUTPUT
            echo "::notice::Protecting $(echo "$PROTECTED_DIGESTS" | tr ',' '\n' | grep -c sha256:) revision image(s)"
          else
            echo "digests=" >> $GITHUB_OUTPUT
            echo "::warning::No revision digests resolved; rollback protection is inactive"
          fi

      - name: List images before cleanup
        if: steps.prod_exists.outputs.found == 'true'
        run: |
          echo "Images before cleanup:"
          TOTAL=$(gcloud artifacts docker images list \
            ${{ env.REGION }}-docker.pkg.dev/carenest-prods/${{ env.REPO }}/backend-prod \
            --project carenest-prods \
            --format="value(VERSION)" 2>/dev/null | grep -c "sha256:" || echo "0")
          
          echo "Total images: $TOTAL"
          echo "total_before=$TOTAL" >> $GITHUB_ENV

      - name: Cleanup old images (keep last 20)
        if: steps.prod_exists.outputs.found == 'true'
        run: |
          KEEP_COUNT="${{ github.event.inputs.keep_count_prod || '20' }}"
          CURRENT_DIGEST="${{ steps.current.outputs.digest }}"
          PROTECTED_DIGESTS="${{ steps.revisions.outputs.digests }}"
          
          echo "Keeping last $KEEP_COUNT images"
          echo "Protected digests: $PROTECTED_DIGESTS"
          
          # Get all image versions sorted by creation time (newest first)
          IMAGES=$(gcloud artifacts docker images list \
            ${{ env.REGION }}-docker.pkg.dev/carenest-prods/${{ env.REPO }}/backend-prod \
            --format="value(VERSION)" \
            --sort-by="~UPDATE_TIME" \
            --project=carenest-prods 2>/dev/null | grep "sha256:" || echo "")
          
          if [ -z "$IMAGES" ]; then
            echo "::notice::No images found to cleanup"
            exit 0
          fi
          
          TOTAL=$(echo "$IMAGES" | wc -l)
          TO_DELETE=$((TOTAL - KEEP_COUNT))
          
          if [ "$TO_DELETE" -le 0 ]; then
            echo "::notice::Nothing to delete - only $TOTAL images exist"
            exit 0
          fi
          
          echo "Deleting $TO_DELETE old images..."
          DELETED=0
          SKIPPED=0
          RETAINED=0
          
          # Delete old images (skip first KEEP_COUNT)
          while read -r version; do
            if [ -z "$version" ]; then continue; fi
            
            # Skip if it's the current image or in recent revisions
            if [ -n "$CURRENT_DIGEST" ] && [ "$version" = "$CURRENT_DIGEST" ]; then
              echo "::notice::Skipping current image: ${version:0:12}"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            
            if echo "$PROTECTED_DIGESTS" | grep -q "$version"; then
              echo "::notice::Skipping protected revision: ${version:0:12}"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            
            IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/carenest-prods/${{ env.REPO }}/backend-prod@$version"
            
            OUTPUT=$(gcloud artifacts docker images delete "$IMAGE_URI" \
              --project=carenest-prods \
              --delete-tags \
              --quiet 2>&1) && RC=0 || RC=$?

            if [ "$RC" -eq 0 ]; then
              echo "Deleted: ${version:0:12}"
              DELETED=$((DELETED + 1))
            elif echo "$OUTPUT" | grep -q "referenced by parent manifests"; then
              # Multi-arch child manifest; cannot be deleted while its parent
              # index is kept. Expected, not a failure.
              echo "Retained (child manifest of a kept index): ${version:0:12}"
              RETAINED=$((RETAINED + 1))
            else
              echo "::warning::Failed to delete ${version:0:12}: $(echo "$OUTPUT" | grep -iE 'ERROR' | head -1)"
            fi
          done < <(echo "$IMAGES" | tail -n "+$((KEEP_COUNT + 1))")
          
          echo "::notice::Deleted $DELETED, skipped $SKIPPED, retained $RETAINED child manifests"

      - name: List images after cleanup
        if: always() && steps.prod_exists.outputs.found == 'true'
        run: |
          echo "Images after cleanup:"
          TOTAL=$(gcloud artifacts docker images list \
            ${{ env.REGION }}-docker.pkg.dev/carenest-prods/${{ env.REPO }}/backend-prod \
            --project carenest-prods \
            --format="value(VERSION)" 2>/dev/null | grep -c "sha256:" || echo "0")
          
          echo "Total images: $TOTAL"
          echo "total_after=$TOTAL" >> $GITHUB_ENV

      - name: Create cleanup summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🧹 Production Cleanup Summary
          
          **Environment:** Production
          **Project:** carenest-prods
          **Service:** backend-prod
          **Region:** ${{ env.REGION }}
          
          ### Results
          - Images before: ${total_before:-N/A}
          - Images after: ${total_after:-N/A}
          - Images deleted: $((${total_before:-0} - ${total_after:-0}))
          
          ### Configuration
          - Keep count: ${{ github.event.inputs.keep_count_prod || '20' }}
          - Current image protected: ✅
          - Recent revisions protected: ✅ (last 5)
          
          ### Safety Features
          - Never deletes currently deployed image
          - Protects last 5 Cloud Run revisions
          - Keeps most recent images for rollback
          
          EOF

  summary:
    name: Cleanup Summary
    runs-on: ubuntu-latest
    needs: [cleanup-dev, cleanup-prod]
    if: always()
    steps:
      - name: Create overall summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🎉 Artifact Registry Cleanup Complete
          
          **Scheduled Run:** Every Sunday at 2 AM UTC
          **Manual Trigger:** Available via workflow_dispatch
          
          ### Status
          - Development: ${{ needs.cleanup-dev.result }}
          - Production: ${{ needs.cleanup-prod.result }}
          
          ### Cost Savings
          Estimated monthly savings: \$1-3 per environment
          
          ### Next Steps
          - Monitor storage usage in Cloud Console
          - Adjust keep_count if needed
          - Review cleanup logs for any issues
          
          ---
          
          💡 **Tip:** You can manually trigger this workflow with custom keep counts from the Actions tab.
          EOF
