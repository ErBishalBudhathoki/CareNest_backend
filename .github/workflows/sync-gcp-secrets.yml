name: Sync Secrets - Infisical to GCP Secret Manager

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to sync (dev, prod, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - prod
  schedule:
    # Daily reconciliation: keep GCP Secret Manager in sync with Infisical
    - cron: '0 3 * * *'

concurrency:
  group: secrets-sync-gcp
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  INFISICAL_API_URL: 'https://secrets.bishalbudhathoki.com/api'
  INFISICAL_PROJECT_ID: '093596b5-5d69-45c1-bbf0-47ec8b9be832'

jobs:
  sync-dev:
    name: Sync dev secrets
    if: contains(fromJson('["all", "dev"]'), github.event.inputs.environment || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate to Google Cloud (Dev)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: invoice-660f3

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical

      - name: Sync dev secrets to GCP
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          export INFISICAL_TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --domain="$INFISICAL_API_URL" --silent --plain)

          infisical export --domain="$INFISICAL_API_URL" --projectId="$INFISICAL_PROJECT_ID" \
            --env=dev --path=/backend --format=json --silent \
            | jq 'map({key: .key, value: .value}) | from_entries' > secrets-dev.json

          echo "Exported $(jq 'keys | length' secrets-dev.json) dev keys"
          gcloud secrets versions add app-secrets-dev --data-file=secrets-dev.json --project=invoice-660f3
          echo "::notice::Dev secrets synced to GCP (app-secrets-dev @ invoice-660f3)"

  sync-prod:
    name: Sync prod secrets
    if: contains(fromJson('["all", "prod"]'), github.event.inputs.environment || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Authenticate to Google Cloud (Prod)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.PROD_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: carenest-prods

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical

      - name: Sync prod secrets to GCP
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          export INFISICAL_TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --domain="$INFISICAL_API_URL" --silent --plain)

          infisical export --domain="$INFISICAL_API_URL" --projectId="$INFISICAL_PROJECT_ID" \
            --env=prod --path=/backend --format=json --silent \
            | jq 'map({key: .key, value: .value}) | from_entries' > secrets-prod.json

          echo "Exported $(jq 'keys | length' secrets-prod.json) prod keys"
          gcloud secrets versions add app-secrets-prod --data-file=secrets-prod.json --project=carenest-prods
          echo "::notice::Prod secrets synced to GCP (app-secrets-prod @ carenest-prods)"
