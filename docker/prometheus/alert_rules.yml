groups:
  # Metric names below MUST match what the application actually exports.
  # The authoritative list is generated by routes/metrics.js and
  # utils/requestTiming.js. A rule that references a metric nothing emits
  # never fires and silently reads as "we have coverage" — which is worse than
  # no rule at all, so anything requiring new instrumentation is parked
  # commented-out with a note rather than left looking live.
  #
  # CAVEAT: every application metric here is a process-local counter. On
  # Cloud Run they reset on each new instance and do not aggregate correctly
  # across replicas, so the rate()-based rules below are indicative only.
  - name: invoice-app-alerts
    rules:
      # http_request_error_rate is a gauge holding a percentage, so it survives
      # counter resets better than rate() on a resetting counter.
      # (The previous rule used http_requests_total{status=~"5.."}, but that
      # metric is exported with no labels, so the selector matched nothing.)
      - alert: HighErrorRate
        expr: http_request_error_rate > 1
        for: 2m
        labels:
          severity: critical
          service: invoice-app
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} of requests on {{ $labels.instance }}"

      # Bucket metric is http_route_duration_seconds (not http_request_duration),
      # and a histogram_quantile needs sum by (le).
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum by (le) (rate(http_route_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
          service: invoice-app
        annotations:
          summary: "High p95 route latency"
          description: "95th percentile tracked-route latency is {{ $value | humanizeDuration }}"

      # nodejs_memory_rss_bytes is what the app exports; process_resident_memory_bytes
      # is the node_exporter name and was never emitted by this service.
      # 400MB sits just under the 512Mi container limit in service.yaml.
      - alert: HighMemoryUsage
        expr: (nodejs_memory_rss_bytes / 1024 / 1024) > 400
        for: 5m
        labels:
          severity: warning
          service: invoice-app
        annotations:
          summary: "High memory usage"
          description: "RSS is {{ $value | humanize }}MB (container limit is 512Mi)"

      - alert: HighHeapUsage
        expr: (nodejs_memory_heap_used_bytes / nodejs_memory_heap_total_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
          service: invoice-app
        annotations:
          summary: "Heap nearly exhausted"
          description: "Heap is {{ $value | humanizePercentage }} of committed — a restart may be close"

      # The app exports system_load_average_1m directly, so no node-exporter
      # dependency is needed for this one.
      - alert: HighSystemLoad
        expr: system_load_average_1m > 2
        for: 5m
        labels:
          severity: warning
          service: invoice-app
        annotations:
          summary: "High system load"
          description: "1-minute load average is {{ $value }}"

      - alert: HighHostMemoryPressure
        expr: system_memory_usage_percent > 90
        for: 5m
        labels:
          severity: warning
          service: invoice-app
        annotations:
          summary: "Host memory pressure"
          description: "Host memory is {{ $value | humanizePercentage }} used"

  - name: business-metrics-alerts
    rules:
      # getBusinessMetrics() returns null on a Mongo failure so Prometheus does
      # not mark the target down, which means a broken DB read is otherwise
      # invisible. This flag is the signal.
      - alert: BusinessMetricsUnavailable
        expr: invoice_business_metrics_available == 0
        for: 5m
        labels:
          severity: warning
          service: invoice-app
          category: business
        annotations:
          summary: "Business metrics are unavailable"
          description: "The DB-backed business counters have failed to read for 5 minutes — check Mongo connectivity"

      - alert: NoRecentInvoices
        expr: invoice_invoices_recent == 0 and invoice_organizations_total > 0
        for: 24h
        labels:
          severity: info
          service: invoice-app
          category: business
        annotations:
          summary: "No invoices created in 30 days"
          description: "Organisations exist but invoice_invoices_recent is 0 — invoice generation may be stalled"

      # Requires metrics the service does not emit yet. Enable alongside the
      # corresponding instrumentation in routes/metrics.js.
      # - alert: LowInvoiceGenerationRate
      #   expr: rate(invoice_generation_total[1h]) < 0.1
      #
      # - alert: HighInvoiceFailureRate
      #   expr: rate(invoice_generation_failures_total[5m]) / rate(invoice_generation_total[5m]) > 0.05
      #
      # - alert: RevenueDropAlert
      #   expr: (revenue_total - revenue_total offset 24h) / revenue_total offset 24h < -0.2
      #
      # - alert: NDISComplianceIssue
      #   expr: ndis_compliance_violations_total > 0

  - name: database-alerts
    rules:
      # Mongo metrics would come from an exporter that is not deployed. Until
      # one is, database health is observed via BusinessMetricsUnavailable
      # above and through MongoDB Atlas tooling.
      # - alert: DatabaseConnectionFailure
      #   expr: mongodb_connections_failed_total > 0
      #
      # - alert: SlowDatabaseQueries
      #   expr: mongodb_query_duration_seconds{quantile="0.95"} > 5
      #
      # - alert: HighDatabaseConnections
      #   expr: mongodb_connections_active > 100

  - name: system-health-alerts
    rules:
      # `up` is generated by Prometheus itself for every scrape target.
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "Scrape target {{ $labels.job }} has been down for more than 1 minute"

      # The next two depend on the node-exporter service being up (job
      # 'node-exporter' in prometheus.yml). If that container is not running
      # these series are absent and the rules simply never evaluate.
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High disk usage"
          description: "Disk {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full"

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "node-exporter is down"
          description: "Host disk and load alerts are blind while the node-exporter is down"

  - name: client-activity-alerts
    rules:
      # Client engagement scoring lives in services/predictiveService.js and
      # services/anomalyService.js but is computed per-request in memory; it is
      # never exported as a gauge. Emitting these would require persisting the
      # scores to a collection first.
      # - alert: ClientInactivityAlert
      #   expr: client_last_activity_hours > 168
      #
      # - alert: LowClientEngagement
      #   expr: client_engagement_score < 0.3
      #
      # - alert: ClientChurnRisk
      #   expr: client_churn_risk_score > 0.8