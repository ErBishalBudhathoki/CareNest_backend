global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # The three invoice-app jobs below require the bearer token because /metrics sits
  # ahead of the App Check gate and self-authenticates with METRICS_SCRAPE_TOKEN
  # (see backend/routes/metrics.js). Mount a file containing that token at
  # /etc/prometheus/metrics_token and make it readable by the prometheus user —
  # see docker/docker-compose.prometheus.yml. Without it the app returns 503.
  #
  # Paths were '/api/metrics/system' and '/api/metrics/business', which never
  # matched: the router was mounted under /api, making the real paths
  # /api/api/metrics/*. They are now /metrics, /metrics/system, /metrics/business.
  - job_name: 'invoice-app'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    bearer_token_file: '/etc/prometheus/metrics_token'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  - job_name: 'invoice-business-metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics/business'
    bearer_token_file: '/etc/prometheus/metrics_token'
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_labels: true

  - job_name: 'invoice-system-health'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics/system'
    bearer_token_file: '/etc/prometheus/metrics_token'
    scrape_interval: 15s
    scrape_timeout: 5s
    honor_labels: true

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: '/metrics'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metrics_path: '/metrics'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: '/metrics'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    scrape_interval: 30s
    metrics_path: '/metrics'